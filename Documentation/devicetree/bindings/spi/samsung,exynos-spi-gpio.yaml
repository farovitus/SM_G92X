%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/samsung,exynos-spi-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bit-banged SPI on a Samsung GPIO bank

maintainers:
  - FAROVITUS <farovitus@gmail.com>

description:
  An SPI host bit-banged on GPIO lines of a Samsung/Exynos pin bank, for
  boards whose SPI controller cannot be used. SCK, MOSI and MISO must be
  lines of the same bank; the host writes that bank's data register once
  per clock edge. Chip selects are GPIOs and may be on any bank.

allOf:
  - $ref: /schemas/spi/spi-controller.yaml#

properties:
  compatible:
    const: samsung,exynos-spi-gpio

  sck-gpios:
    maxItems: 1

  mosi-gpios:
    maxItems: 1

  miso-gpios:
    maxItems: 1

  cs-gpios:
    minItems: 1

required:
  - compatible
  - sck-gpios
  - mosi-gpios
  - miso-gpios
  - cs-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    spi {
        compatible = "samsung,exynos-spi-gpio";
        #address-cells = <1>;
        #size-cells = <0>;
        sck-gpios = <&gpd6 2 GPIO_ACTIVE_HIGH>;
        miso-gpios = <&gpd6 4 GPIO_ACTIVE_HIGH>;
        mosi-gpios = <&gpd6 5 GPIO_ACTIVE_HIGH>;
        cs-gpios = <&gpd6 3 GPIO_ACTIVE_LOW>;
    };
...
